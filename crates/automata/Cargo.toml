[package]
name = "automata"
version = "0.0.4"
readme = "README.md"
description = "A library for transition systems and automata over (in)finite words."
repository.workspace = true
keywords = [
    "transition-system",
    "language",
    "hoa",
    "automata",
    "omega-automata",
]
categories = ["mathematics", "science"]
license.workspace = true
edition.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
tracing = { workspace = true }
biodivine-lib-bdd = { workspace = true }
itertools = { workspace = true }
indexmap = { workspace = true }
bimap = { workspace = true }
rand = { workspace = true }
tabled = { workspace = true }
thiserror = { workspace = true }

automata-core = { version = "0.1.0", path = "../automata-core" }
hoars = { version = "0.2.1", optional = true, path = "../hoars" }

petgraph = { version = "0.8", optional = true }

layout-rs = { version = "0.1.2", optional = true }
open = { version = "5.3.2", optional = true }
base64 = { version = "0.23", optional = true }
resvg = { version = "0.48", optional = true }
usvg = { version = "0.48", optional = true, features = [
    "text",
    "system-fonts",
] }

owo-colors = "4.2"
tempfile = { version = "3.17", optional = true }
bit-set = "0.11"
clap = { version = "4.5", optional = true }
rand_distr = { version = "0.6", optional = true }

[dev-dependencies]
test-log = { version = "0.2", features = ["trace"] }

[features]
default = ["hoa", "random", "render"]
random = ["dep:rand_distr"]
hoa = ["dep:hoars"]
graphviz = ["dep:tempfile", "dep:open", "render"]
implementations = []
petgraph = ["dep:petgraph"]
render = ["dep:layout-rs", "dep:base64", "dep:resvg", "dep:open", "dep:usvg"]
