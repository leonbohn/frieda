[workspace]
# we use the 2024 edition resolver
resolver = "3"

members = ["bin/*"]
exclude = ["python"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/leonbohn/frieda"
homepage = "https://github.com/leonbohn/frieda"
authors = ["León Bohn <bohn@lics.rwth-aachen.de>"]

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
itertools = "0.15"

# TODO: depend on released versions once automata (and automata-learning) are published
automata = { git = "https://github.com/leonbohn/automata" }
automata-learning = { git = "https://github.com/leonbohn/automata-learning" }
